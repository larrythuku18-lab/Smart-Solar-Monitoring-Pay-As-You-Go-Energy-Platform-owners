# NOTE: as of 2026-06, the live Render service does not appear to be managed
# as an active Blueprint sync target — its actual region (Singapore) and
# database name (SolarTracker-db) don't match what's declared below, which
# only makes sense if it was created manually through Render's dashboard
# rather than from this file. Updated the values below to match what's
# actually running, but treat this file as documentation of intent unless
# you've confirmed in Render's dashboard that Blueprint sync is active for
# this service — env vars not listed here are managed by hand in the
# dashboard's Environment tab and won't be restored from this file.
services:
  - type: web
    name: Smart-Solar-Monitoring-Pay-As-You-Go-Energy-Platform
    env: node
    region: singapore
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      # DATABASE_URL is deliberately NOT declared here. Production has run on
      # Neon since 2026-07-06 (the free Render Postgres this file used to
      # declare via fromDatabase expired after 30 days and was deleted); the
      # Neon direct URL is set by hand in the dashboard's Environment tab.
      # Re-adding a fromDatabase reference would silently point the app at a
      # fresh, empty Render database if Blueprint sync were ever activated.
      - key: MPESA_ENVIRONMENT
        value: sandbox
      # Set these manually in the Render dashboard (not tracked here):
      # MPESA_CONSUMER_KEY, MPESA_CONSUMER_SECRET, MPESA_SHORTCODE, MPESA_PASSKEY,
      #   MPESA_CALLBACK_URL, MPESA_CALLBACK_SECRET
      # DEVICE_API_KEY
      # ALLOWED_ORIGINS
      # ADMIN_EMAIL, ADMIN_PASSWORD, CUSTOMER_EMAIL  (demo account overrides)
      # RESEND_API_KEY, RESEND_FROM_EMAIL  (login alerts + signup confirmation)
      # SENTRY_DSN  (error monitoring)
      # WEATHER_LAT, WEATHER_LON  (dashboard weather location; defaults to Nairobi)

# No databases: section — the Render free Postgres expired 2026-06 and was
# deleted; production uses Neon (see DATABASE_URL note above). Declaring one
# here would create a new empty free-tier DB on Blueprint sync.
