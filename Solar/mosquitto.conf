# Mosquitto MQTT Broker Configuration for SolarPAYG

# Basic configuration
listener 1883
protocol mqtt

# WebSocket support
listener 9001
protocol websockets

# Security
allow_anonymous true
# In production, set allow_anonymous false and configure authentication

# Persistence
persistence true
persistence_location /mosquitto/data/
autosave_interval 1800

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_type all
log_timestamp true
connection_messages true

# Performance tuning
max_connections -1
max_queued_messages 1000
message_size_limit 0

# Topic access control (optional - for production hardening)
# pattern read solar/%u/#
# pattern write solar/%u/#
# pattern read solar/+/status
# pattern write solar/+/control