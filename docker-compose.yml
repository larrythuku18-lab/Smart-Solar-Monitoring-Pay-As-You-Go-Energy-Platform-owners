version: '3.8'

services:
  # Main application
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # db.js reads a single DATABASE_URL connection string, not separate
      # DB_HOST/DB_PORT/etc — set it explicitly so the app can actually
      # reach the postgres service by its Docker network hostname.
      - DATABASE_URL=postgresql://solarpayg:solarpayg_password@postgres:5432/solarpayg
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production-min-32-chars}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - solarpayg

  # PostgreSQL database
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=solarpayg
      - POSTGRES_USER=solarpayg
      - POSTGRES_PASSWORD=solarpayg_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solarpayg -d solarpayg"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - solarpayg

  # pgAdmin for database management (optional)
  pgadmin:
    image: dpage/pgadmin4
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@solarpayg.com
      - PGADMIN_DEFAULT_PASSWORD=admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - solarpayg

volumes:
  postgres_data:

networks:
  solarpayg:
    driver: bridge