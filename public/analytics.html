<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SolarPAYG — Analytics Dashboard</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@3.4.4/dist/tailwind.min.css"
        crossorigin integrity="sha384-OLBgp1GsljhM2TJ+sbHjaiH9txEUvgdDTAzHv2P24donTt6/529l+9Ua0vFImLlb">
  <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"
          crossorigin integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"
          crossorigin integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"
          crossorigin integrity="sha384-e6nUZLBkQ86NJ6TVVKAeSaK8jWa3NhkYWZFomE39AvDbQWeie9PlQqM3pmYW5d1g"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-chartjs-2@5.2.0/dist/react-chartjs-2.min.js"
          crossorigin integrity="sha384-OLBgp1GsljhM2TJ+sbHjaiH9txEUvgdDTAzHv2P24donTt6/529l+9Ua0vFImLlb"></script>

  <!-- Global nav styles -->
  <link rel="stylesheet" href="/nav.css" />

  <style>
    body {
      background-image:
        radial-gradient(ellipse at top center, rgba(59, 130, 246, 0.08) 0%, transparent 45%),
        linear-gradient(180deg, #020617 0%, #0c1524 55%, #050c18 100%);
      color: #f8fafc;
      min-height: 100vh;
    }

    /* Spinner keyframe used by the Spinner component */
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Subtle pulse used by the live indicator */
    @keyframes live-pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.45; }
    }

    .live-dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #10b981;
      animation: live-pulse 1.8s ease-in-out infinite;
    }

    /* Smooth card hover lift */
    .analytics-card {
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }
    .analytics-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
    }

    /* Progress bar fill animation */
    .progress-fill {
      transition: width 0.7s ease;
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.4); }
    ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.25); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.4); }
  </style>
</head>
<body class="with-nav">
  <div id="root"></div>

  <!-- Analytics Dashboard React component -->
  <script src="./analytics.js"></script>

  <script src="/nav-init.js"></script>
</body>
</html>
