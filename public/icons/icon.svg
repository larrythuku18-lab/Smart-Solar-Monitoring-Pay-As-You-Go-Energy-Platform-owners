<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <radialGradient id="bg" cx="30%" cy="25%" r="85%">
      <stop offset="0%"  stop-color="#0d1520"/>
      <stop offset="100%" stop-color="#060b16"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Sun rays -->
  <g fill="url(#brand)">
    <rect x="240" y="64"  width="32" height="76" rx="16"/>
    <rect x="240" y="372" width="32" height="76" rx="16"/>
    <rect x="64"  y="240" width="76" height="32" rx="16"/>
    <rect x="372" y="240" width="76" height="32" rx="16"/>
    <rect x="240" y="64"  width="32" height="76" rx="16" transform="rotate(45 256 256)"/>
    <rect x="240" y="372" width="32" height="76" rx="16" transform="rotate(45 256 256)"/>
    <rect x="64"  y="240" width="76" height="32" rx="16" transform="rotate(45 256 256)"/>
    <rect x="372" y="240" width="76" height="32" rx="16" transform="rotate(45 256 256)"/>
  </g>

  <!-- Sun core -->
  <circle cx="256" cy="256" r="92" fill="url(#brand)"/>
</svg>
