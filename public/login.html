<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SolarPAYG — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #060b16; --surface: #0d1520; --card: #111d2e; --border: #1a2840;
      --amber: #f59e0b; --green: #10b981; --blue: #3b82f6; --red: #ef4444;
      --purple: #8b5cf6; --text: #f1f5f9; --muted: #64748b; --sub: #94a3b8;
    }

    html, body {
      min-height: 100vh;
      font-family: 'Space Grotesk', sans-serif;
      color: var(--text);
    }

    body {
      background:
        radial-gradient(ellipse at 20% 20%, rgba(245,158,11,0.07) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(16,185,129,0.06) 0%, transparent 50%),
        linear-gradient(180deg, #060b16 0%, #08101e 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    /* ── Card ── */
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 32px 80px rgba(0,0,0,0.5);
    }

    /* ── Top accent bar ── */
    .card::before {
      content: '';
      display: block;
      height: 3px;
      background: linear-gradient(90deg, var(--amber) 0%, var(--green) 50%, var(--blue) 100%);
    }

    .card-body { padding: 36px 32px 28px; }

    /* ── Logo ── */
    .logo-wrap { text-align: center; margin-bottom: 28px; }
    .logo {
      font-family: 'Syne', sans-serif;
      font-size: 32px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--amber) 0%, var(--green) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
    }
    .tagline { font-size: 12px; color: var(--muted); margin-top: 6px; letter-spacing: .02em; }

    /* ── Role toggle ── */
    .role-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 24px;
      gap: 4px;
    }
    .role-btn {
      padding: 10px 8px;
      border-radius: 9px;
      border: none;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all .2s;
      color: var(--muted);
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .role-btn.active-admin {
      background: linear-gradient(135deg, rgba(139,92,246,0.18), rgba(99,102,241,0.12));
      color: #c4b5fd;
      border: 1px solid rgba(139,92,246,0.3);
      box-shadow: 0 2px 12px rgba(139,92,246,0.15);
    }
    .role-btn.active-customer {
      background: linear-gradient(135deg, rgba(16,185,129,0.18), rgba(20,184,166,0.12));
      color: #6ee7b7;
      border: 1px solid rgba(16,185,129,0.3);
      box-shadow: 0 2px 12px rgba(16,185,129,0.15);
    }
    .role-btn:not(.active-admin):not(.active-customer):hover { color: var(--sub); background: rgba(255,255,255,.04); }

    /* ── Role description pill ── */
    .role-desc {
      font-size: 11px;
      padding: 8px 14px;
      border-radius: 8px;
      margin-bottom: 20px;
      line-height: 1.5;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .role-desc.admin-desc    { background: rgba(139,92,246,0.07); color: #ddd6fe; border: 1px solid rgba(139,92,246,0.2); }
    .role-desc.customer-desc { background: rgba(16,185,129,0.07);  color: #a7f3d0; border: 1px solid rgba(16,185,129,0.2); }

    /* ── Form ── */
    .form-group { margin-bottom: 16px; }
    .form-label {
      display: block;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .06em;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 7px;
    }
    .form-input {
      width: 100%;
      padding: 12px 14px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 14px;
      outline: none;
      transition: border-color .18s, box-shadow .18s, background .18s;
    }
    .form-input:focus {
      border-color: var(--amber);
      box-shadow: 0 0 0 3px rgba(245,158,11,0.08);
      background: rgba(245,158,11,0.02);
    }
    .form-input::placeholder { color: var(--muted); }

    /* ── Submit ── */
    .submit-btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      font-family: 'Syne', sans-serif;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: all .2s;
      margin-top: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      letter-spacing: .01em;
    }
    .submit-btn.admin-btn {
      background: linear-gradient(135deg, #7c3aed, #6366f1);
      color: #fff;
      box-shadow: 0 4px 20px rgba(124,58,237,0.3);
    }
    .submit-btn.admin-btn:hover:not(:disabled) { box-shadow: 0 6px 28px rgba(124,58,237,0.45); transform: translateY(-1px); }
    .submit-btn.customer-btn {
      background: linear-gradient(135deg, #047857, #059669);
      color: #f0fdf4;
      box-shadow: 0 4px 20px rgba(16,185,129,0.3);
    }
    .submit-btn.customer-btn:hover:not(:disabled) { box-shadow: 0 6px 28px rgba(16,185,129,0.45); transform: translateY(-1px); }
    .submit-btn:active:not(:disabled) { transform: translateY(0); }
    .submit-btn:disabled { opacity: .55; cursor: not-allowed; transform: none !important; }

    /* ── Spinner ── */
    .spinner {
      width: 15px; height: 15px;
      border: 2px solid rgba(255,255,255,0.25);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .75s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Alert ── */
    .alert {
      padding: 11px 14px;
      border-radius: 10px;
      font-size: 12px;
      line-height: 1.5;
      margin-bottom: 16px;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      border: 1px solid;
    }
    .alert-error   { background: rgba(239,68,68,0.07);   border-color: rgba(239,68,68,0.25);   color: #fda4af; }
    .alert-success { background: rgba(16,185,129,0.07);  border-color: rgba(16,185,129,0.25);  color: #a7f3d0; }

    /* ── Demo credentials ── */
    .demo-box {
      margin-top: 20px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .demo-head {
      padding: 9px 14px;
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: .08em;
      font-weight: 700;
      color: var(--muted);
      background: rgba(255,255,255,.02);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .demo-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 14px;
      border-bottom: 1px solid rgba(255,255,255,.04);
      font-size: 11px;
      gap: 12px;
    }
    .demo-row:last-child { border-bottom: none; }
    .demo-row.clickable { cursor: pointer; transition: background .15s; }
    .demo-row.clickable:hover { background: rgba(255,255,255,.04); }
    .demo-row.clickable:active { background: rgba(255,255,255,.07); }
    .demo-key { color: var(--muted); white-space: nowrap; }
    .demo-val {
      font-family: monospace;
      font-size: 11px;
      font-weight: 600;
      text-align: right;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .demo-val.amber { color: var(--amber); }
    .demo-val.green { color: var(--green); }
    .demo-val.blue  { color: #93c5fd; }
    .demo-section-label {
      padding: 6px 14px 3px;
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: var(--muted);
      opacity: .7;
    }
    .demo-note {
      padding: 8px 14px;
      font-size: 10px;
      color: var(--muted);
      border-top: 1px solid var(--border);
      background: rgba(255,255,255,.01);
    }

    /* ── Password visibility toggle ── */
    .pw-wrap { position: relative; }
    .pw-wrap .form-input { padding-right: 42px; }
    .pw-toggle {
      position: absolute;
      right: 13px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      padding: 2px;
      color: var(--muted);
      display: flex;
      align-items: center;
      transition: color .15s;
    }
    .pw-toggle:hover { color: var(--sub); }
    .pw-toggle svg { width: 17px; height: 17px; }

    /* ── Auth mode toggle (login / sign up) ── */
    .auth-toggle {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      margin-top: 14px;
    }
    .auth-toggle a {
      color: var(--green);
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }
    .auth-toggle a:hover { text-decoration: underline; }

    /* ── Divider ── */
    .divider {
      display: flex; align-items: center; gap: 10px;
      margin: 20px 0 4px;
      font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }

    /* ── Footer ── */
    .card-footer {
      text-align: center;
      padding: 14px 32px 20px;
      font-size: 11px;
      color: var(--muted);
      border-top: 1px solid var(--border);
    }

    @media (max-width: 440px) {
      .card-body { padding: 28px 20px 20px; }
      .card-footer { padding: 12px 20px 18px; }
      .logo { font-size: 26px; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-body">

      <!-- Logo -->
      <div class="logo-wrap">
        <div class="logo">SolarPAYG</div>
        <div class="tagline">Smart Solar Monitoring &amp; Pay-As-You-Go Energy</div>
      </div>

      <!-- Alert -->
      <div id="alert-box" style="display:none"></div>

      <!-- Role toggle -->
      <div class="role-toggle">
        <button class="role-btn active-admin" id="btn-admin">Admin / Operator</button>
        <button class="role-btn" id="btn-customer">Customer</button>
      </div>

      <!-- Role description -->
      <div id="role-desc" class="role-desc admin-desc">
        <span id="role-desc-text">Full system access — dashboards, analytics, transaction management, and AI insights.</span>
      </div>

      <!-- Form -->
      <form id="login-form" novalidate>
        <div class="form-group" id="name-group" style="display:none">
          <label class="form-label" for="reg-name">Full Name</label>
          <input id="reg-name" class="form-input" type="text" autocomplete="name" placeholder="Jane Doe" required />
        </div>
        <div class="form-group">
          <label class="form-label" id="id-label" for="identifier">Email Address</label>
          <input id="identifier" class="form-input" type="text" autocomplete="username"
                 placeholder="admin@solarpayg.com" required />
        </div>
        <div class="form-group" id="phone-group" style="display:none">
          <label class="form-label" for="reg-phone">Phone Number (optional)</label>
          <input id="reg-phone" class="form-input" type="tel" autocomplete="tel" placeholder="07XXXXXXXX" />
        </div>
        <div class="form-group">
          <label class="form-label" id="pw-label" for="password">Password</label>
          <div class="pw-wrap">
            <input id="password" class="form-input" type="password" autocomplete="current-password"
                   placeholder="Enter password or PIN" required />
            <button type="button" class="pw-toggle" data-target="password" aria-label="Show password">
              <svg id="eye-password" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <div class="form-group" id="confirm-group" style="display:none">
          <label class="form-label" for="confirm-password">Confirm Password</label>
          <div class="pw-wrap">
            <input id="confirm-password" class="form-input" type="password" autocomplete="new-password"
                   placeholder="Re-enter password" />
            <button type="button" class="pw-toggle" data-target="confirm-password" aria-label="Show confirm password">
              <svg id="eye-confirm-password" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <button type="submit" class="submit-btn admin-btn" id="submit-btn">
          <span id="btn-text">Sign in as Admin</span>
        </button>
      </form>

      <!-- Sign up / sign in toggle (customer only) -->
      <div id="auth-toggle" class="auth-toggle" style="display:none">
        <span id="auth-toggle-text">New customer?</span> <a id="auth-toggle-link">Create an account</a>
      </div>

      <!-- Demo credentials -->
      <div class="divider" id="demo-divider">Demo credentials</div>
      <div class="demo-box" id="demo-box">
        <!-- populated by JS -->
      </div>

    </div><!-- /card-body -->

    <div class="card-footer">
      All data is simulated · SolarPAYG v2.1 · Nairobi, Kenya
    </div>
  </div>

<script>
  const API = '/api';
  let activeRole = 'admin';
  let authMode   = 'login'; // 'login' | 'signup' (signup only available for customers)

  /* ── Demo credential sets ── */
  const CREDS = {
    admin: [
      { key: 'Email',    val: 'admin@solarpayg.com', cls: 'amber' },
      { key: 'Password', val: 'Admin@12345',          cls: 'amber' }
    ],
    customer: [
      { key: 'Email',    val: 'customer@example.com', cls: 'green' },
      { key: 'Password', val: 'Customer@12345',        cls: 'green' },
      { key: 'Device ID (alt)', val: 'DEMO-001', cls: 'blue' },
      { key: 'PIN (alt)',       val: '1234',     cls: 'blue' }
    ]
  };

  /* ── Fill demo box ── */
  function renderDemoBox(role) {
    const head = `<div class="demo-head">Test Credentials <span style="color:var(--amber)">· click row to fill</span></div>`;
    const note = `<div class="demo-note">Demo only — not for production use</div>`;

    let rows = '';
    if (role === 'admin') {
      rows = `
        <div class="demo-row clickable" data-fill="admin" title="Click to fill">
          <span class="demo-key">Email</span>
          <span class="demo-val amber">${CREDS.admin[0].val}</span>
        </div>
        <div class="demo-row clickable" data-fill="admin" title="Click to fill">
          <span class="demo-key">Password</span>
          <span class="demo-val amber">${CREDS.admin[1].val}</span>
        </div>`;
    } else {
      rows = `
        <div class="demo-section-label">Email &amp; password</div>
        <div class="demo-row clickable" data-fill="customer-email" title="Click to fill">
          <span class="demo-key">Email</span>
          <span class="demo-val green">${CREDS.customer[0].val}</span>
        </div>
        <div class="demo-row clickable" data-fill="customer-email" title="Click to fill">
          <span class="demo-key">Password</span>
          <span class="demo-val green">${CREDS.customer[1].val}</span>
        </div>
        <div class="demo-section-label">Device ID &amp; PIN (alternative)</div>
        <div class="demo-row clickable" data-fill="customer-device" title="Click to fill">
          <span class="demo-key">Device ID</span>
          <span class="demo-val blue">${CREDS.customer[2].val}</span>
        </div>
        <div class="demo-row clickable" data-fill="customer-device" title="Click to fill">
          <span class="demo-key">PIN</span>
          <span class="demo-val blue">${CREDS.customer[3].val}</span>
        </div>`;
    }

    document.getElementById('demo-box').innerHTML = head + rows + note;
  }

  /* ── Fill form with demo creds ── */
  function fillCreds(set) {
    const id  = document.getElementById('identifier');
    const pw  = document.getElementById('password');
    if (set === 'admin') {
      id.value = CREDS.admin[0].val;
      pw.value = CREDS.admin[1].val; // NOSONAR
    } else if (set === 'customer-email') {
      id.value = CREDS.customer[0].val;
      pw.value = CREDS.customer[1].val; // NOSONAR
    } else if (set === 'customer-device') {
      id.value = CREDS.customer[2].val;
      pw.value = CREDS.customer[3].val; // NOSONAR
    }
  }

  /* ── Switch role ── */
  function setRole(role) {
    activeRole = role;

    const btnAdmin    = document.getElementById('btn-admin');
    const btnCustomer = document.getElementById('btn-customer');
    const desc        = document.getElementById('role-desc');
    const descTxt     = document.getElementById('role-desc-text');
    const idLabel     = document.getElementById('id-label');
    const idInput     = document.getElementById('identifier');
    const pwLabel     = document.getElementById('pw-label');
    const submitBtn   = document.getElementById('submit-btn');
    const btnText     = document.getElementById('btn-text');

    if (role === 'admin') {
      btnAdmin.className    = 'role-btn active-admin';
      btnCustomer.className = 'role-btn';
      desc.className        = 'role-desc admin-desc';
      descTxt.textContent   = 'Full system access — dashboards, analytics, transaction management, and AI insights.';
      idLabel.textContent   = 'Email Address';
      idInput.placeholder   = 'admin@solarpayg.com';
      pwLabel.textContent   = 'Password';
      submitBtn.className   = 'submit-btn admin-btn';
      btnText.textContent   = 'Sign in as Admin';
      document.getElementById('auth-toggle').style.display = 'none';
    } else {
      btnAdmin.className    = 'role-btn';
      btnCustomer.className = 'role-btn active-customer';
      desc.className        = 'role-desc customer-desc';
      descTxt.textContent   = 'View your device, wallet balance, energy usage, and make M-Pesa payments.';
      idLabel.textContent   = 'Device ID or Email';
      idInput.placeholder   = 'DEMO-001 or customer@example.com';
      pwLabel.textContent   = 'PIN or Password';
      submitBtn.className   = 'submit-btn customer-btn';
      btnText.textContent   = 'Sign in as Customer';
      document.getElementById('auth-toggle').style.display = 'block';
    }

    document.getElementById('identifier').value = '';
    document.getElementById('password').value   = '';
    setAuthMode('login');
    clearAlert();
    renderDemoBox(role);
  }

  /* ── Default submit-button label for the current role/mode ── */
  function defaultBtnText() {
    if (activeRole === 'admin') return 'Sign in as Admin';
    return authMode === 'signup' ? 'Create Account' : 'Sign in as Customer';
  }

  /* ── Switch between sign-in and sign-up (customer only) ── */
  function setAuthMode(mode) {
    authMode = mode;

    const nameGroup    = document.getElementById('name-group');
    const phoneGroup   = document.getElementById('phone-group');
    const confirmGroup = document.getElementById('confirm-group');
    const idLabel      = document.getElementById('id-label');
    const idInput      = document.getElementById('identifier');
    const pwLabel      = document.getElementById('pw-label');
    const passwordEl   = document.getElementById('password');
    const toggleText   = document.getElementById('auth-toggle-text');
    const toggleLink   = document.getElementById('auth-toggle-link');
    const demoDivider  = document.getElementById('demo-divider');
    const demoBox      = document.getElementById('demo-box');

    const isSignup = mode === 'signup';

    nameGroup.style.display    = isSignup ? 'block' : 'none';
    phoneGroup.style.display   = isSignup ? 'block' : 'none';
    confirmGroup.style.display = isSignup ? 'block' : 'none';
    demoDivider.style.display  = isSignup ? 'none'  : 'block';
    demoBox.style.display      = isSignup ? 'none'  : 'block';

    if (isSignup) {
      idLabel.textContent    = 'Email Address';
      idInput.placeholder    = 'you@example.com';
      pwLabel.textContent    = 'Create Password';
      passwordEl.placeholder = 'At least 8 characters';
      toggleText.textContent = 'Already have an account?';
      toggleLink.textContent = 'Sign in';
    } else {
      idLabel.textContent    = 'Device ID or Email';
      idInput.placeholder    = 'DEMO-001 or customer@example.com';
      pwLabel.textContent    = 'PIN or Password';
      passwordEl.placeholder = 'Enter password or PIN';
      toggleText.textContent = 'New customer?';
      toggleLink.textContent = 'Create an account';
    }

    document.getElementById('reg-name').value        = '';
    document.getElementById('reg-phone').value       = '';
    document.getElementById('confirm-password').value = '';
    document.getElementById('btn-text').textContent  = defaultBtnText();
    clearAlert();
  }

  /* ── Alert helpers ── */
  function showAlert(msg, type) {
    const box = document.getElementById('alert-box');
    box.style.display = 'flex';
    box.className      = `alert alert-${type}`;
    box.innerHTML      = `<span>${msg}</span>`;
    if (type === 'error') setTimeout(clearAlert, 5000);
  }
  function clearAlert() {
    const box = document.getElementById('alert-box');
    box.style.display = 'none';
    box.innerHTML      = '';
  }

  /* ── Login / Sign up ── */
  async function handleLogin(e) {
    e.preventDefault();
    clearAlert();

    if (authMode === 'signup') return handleSignup();

    const identifier = document.getElementById('identifier').value.trim();
    const password   = document.getElementById('password').value;

    if (!identifier || !password) {
      showAlert('Please enter both identifier and password / PIN.', 'error');
      return;
    }

    const btn     = document.getElementById('submit-btn');
    const btnText = document.getElementById('btn-text');
    btn.disabled  = true;
    btnText.innerHTML = '<span class="spinner"></span> Signing in…';

    try {
      /* Build payload: device ID + numeric PIN  vs  email + password */
      const isDeviceId = /^[A-Z0-9-]{3,20}$/i.test(identifier) && /^\d{3,6}$/.test(password);
      const payload    = isDeviceId
        ? { deviceId: identifier.toUpperCase(), pin: password }
        : { email: identifier, password };

      const res  = await fetch(`${API}/auth/login`, {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify(payload)
      });
      const data = await res.json().catch(() => ({}));
      const tok  = data.token || data.accessToken;

      if (!res.ok || !tok) {
        showAlert(data.error || data.message || 'Invalid credentials. Please try again.', 'error');
        btn.disabled  = false;
        btnText.textContent = defaultBtnText();
        return;
      }

      /* Persist token and role */
      const role = data.user?.role || 'customer';
      localStorage.setItem('authToken', tok);
      localStorage.setItem('userRole',  role);
      if (data.user?.deviceId) localStorage.setItem('deviceId', data.user.deviceId);

      showAlert('Login successful! Redirecting…', 'success');

      /* Role-based redirect — show intro on fresh login */
      setTimeout(() => {
        globalThis.location.href = '/intro.html';
      }, 700);

    } catch (err) {
      console.error('Login error:', err);
      showAlert('Network error. Please check your connection.', 'error');
      btn.disabled  = false;
      btnText.textContent = defaultBtnText();
    }
  }

  /* ── Sign up (customer self-registration) ── */
  async function handleSignup() {
    const name            = document.getElementById('reg-name').value.trim();
    const email           = document.getElementById('identifier').value.trim();
    const phone           = document.getElementById('reg-phone').value.trim();
    const password        = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirm-password').value;

    if (!name) {
      showAlert('Please enter your full name.', 'error');
      return;
    }
    if (!email || !password) {
      showAlert('Please enter an email and password.', 'error');
      return;
    }
    if (password.length < 8) {
      showAlert('Password must be at least 8 characters.', 'error');
      return;
    }
    if (password !== confirmPassword) {
      showAlert('Passwords do not match.', 'error');
      return;
    }

    const btn     = document.getElementById('submit-btn');
    const btnText = document.getElementById('btn-text');
    btn.disabled  = true;
    btnText.innerHTML = '<span class="spinner"></span> Creating account…';

    try {
      const res  = await fetch(`${API}/auth/register`, {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ name, email, password, phone })
      });
      const data = await res.json().catch(() => ({}));
      const tok  = data.token || data.accessToken;

      if (!res.ok || !tok) {
        showAlert(data.error || data.message || 'Could not create account. Please try again.', 'error');
        btn.disabled  = false;
        btnText.textContent = defaultBtnText();
        return;
      }

      localStorage.setItem('authToken', tok);
      localStorage.setItem('userRole',  data.user?.role || 'customer');
      if (data.user?.deviceId) localStorage.setItem('deviceId', data.user.deviceId);

      showAlert('Account created! Redirecting…', 'success');

      setTimeout(() => {
        globalThis.location.href = '/intro.html';
      }, 700);

    } catch (err) {
      console.error('Sign up error:', err);
      showAlert('Network error. Please check your connection.', 'error');
      btn.disabled  = false;
      btnText.textContent = defaultBtnText();
    }
  }

  /* ── Auto-redirect if already logged in ── */
  (async () => {
    const tok = localStorage.getItem('authToken');
    if (!tok) return;
    try {
      const res  = await fetch(`${API}/auth/me`, { headers: { Authorization: `Bearer ${tok}` } });
      if (!res.ok) { localStorage.removeItem('authToken'); return; }
      const user = await res.json();
      globalThis.location.href = (user.role === 'admin') ? '/admin.html' : '/customer.html';
    } catch (e) {
      console.warn('Auto-redirect check failed — showing login form.', e);
    }
  })();

  /* ── Init ── */
  document.getElementById('btn-admin').addEventListener('click', () => setRole('admin'));
  document.getElementById('btn-customer').addEventListener('click', () => setRole('customer'));
  document.getElementById('login-form').addEventListener('submit', handleLogin);
  document.getElementById('demo-box').addEventListener('click', e => {
    const row = e.target.closest('[data-fill]');
    if (row) fillCreds(row.dataset.fill);
  });
  document.getElementById('auth-toggle-link').addEventListener('click', e => {
    e.preventDefault();
    setAuthMode(authMode === 'login' ? 'signup' : 'login');
  });

  /* ── Password visibility toggles ── */
  const EYE_OPEN  = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
  const EYE_SHUT  = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>`;
  document.querySelectorAll('.pw-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const input = document.getElementById(btn.dataset.target);
      const eye   = btn.querySelector('svg');
      if (input.type === 'password') {
        input.type  = 'text';
        eye.innerHTML = EYE_SHUT;
        btn.setAttribute('aria-label', 'Hide password');
      } else {
        input.type  = 'password';
        eye.innerHTML = EYE_OPEN;
        btn.setAttribute('aria-label', 'Show password');
      }
    });
  });
  renderDemoBox('admin');
</script>
</body>
</html>
