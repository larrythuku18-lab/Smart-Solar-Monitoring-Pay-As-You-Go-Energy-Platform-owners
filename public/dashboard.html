<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SolarPAYG Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-chartjs-2@5.2.0/dist/index.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
  <link rel="stylesheet" href="/nav.css">
</head>
<body class="bg-slate-50 dark:bg-slate-950 with-nav">
  <div id="root"></div>
  <script type="text/babel" data-type="module" src="./dashboard.jsx"></script>
  <script>
if (!document.querySelector('meta[name="nav-inserted"]')) {
  document.addEventListener('DOMContentLoaded', async () => {
    try {
      const res = await fetch('/nav.html');
      if (!res.ok) return;
      const html = await res.text();
      const temp = document.createElement('template');
      temp.innerHTML = html.trim();
      const nav = temp.content.firstElementChild;
      if (nav) {
        document.body.prepend(nav);
        document.body.classList.add('with-nav');
      }
    } catch (err) {
      console.warn('Failed to load global nav:', err);
    }
  });
}
</script>
</body>
</html>
