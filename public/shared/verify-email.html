<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SolGrid — Verify Email</title>
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #060b16; --surface: #0d1520; --card: #111d2e; --border: #1a2840;
      --amber: #f59e0b; --green: #10b981; --red: #ef4444;
      --text: #f1f5f9; --muted: #64748b; --sub: #94a3b8;
    }
    html, body { min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; color: var(--text); }
    body {
      background:
        radial-gradient(ellipse at 20% 20%, rgba(245,158,11,0.07) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(16,185,129,0.06) 0%, transparent 50%),
        linear-gradient(180deg, #060b16 0%, #08101e 100%);
      display: flex; align-items: center; justify-content: center; padding: 24px 16px;
    }
    .card {
      width: 100%; max-width: 420px; background: var(--surface);
      border: 1px solid var(--border); border-radius: 20px; overflow: hidden;
      box-shadow: 0 32px 80px rgba(0,0,0,0.5);
    }
    .card::before { content: ''; display: block; height: 3px; background: linear-gradient(90deg, var(--amber) 0%, var(--green) 50%, var(--blue, #3b82f6) 100%); }
    .card-body { padding: 36px 32px 28px; text-align: center; }
    .logo { font-size: 32px; font-weight: 800; background: linear-gradient(135deg, var(--amber) 0%, var(--green) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; line-height: 1; }
    .tagline { font-size: 12px; color: var(--muted); margin-top: 6px; letter-spacing: .02em; }
    .status {
      margin-top: 28px; padding: 22px 18px; border-radius: 14px;
      background: var(--card); border: 1px solid var(--border);
      font-size: 14px; line-height: 1.6; color: var(--sub);
    }
    .status .icon { font-size: 40px; display: block; margin-bottom: 10px; }
    .status h2 { font-size: 17px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
    .status p { font-size: 13px; }
    .status.ok    { border-color: rgba(16,185,129,.35); }
    .status.bad   { border-color: rgba(239,68,68,.35); }
    .btn {
      display: inline-block; margin-top: 18px; padding: 12px 22px; border-radius: 10px;
      border: none; background: linear-gradient(135deg, var(--amber), #d97706);
      color: #0b0f19; font-size: 14px; font-weight: 700; text-decoration: none; cursor: pointer;
    }
    .btn.secondary { background: transparent; border: 1px solid var(--border); color: var(--sub); font-weight: 600; }
    .spinner {
      display: inline-block; width: 18px; height: 18px; border: 2px solid rgba(241,245,249,.25);
      border-top-color: var(--amber); border-radius: 50%; animation: spin .8s linear infinite;
      vertical-align: -3px; margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .muted { font-size: 11px; color: var(--muted); margin-top: 22px; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-body">
      <div class="logo">SolGrid</div>
      <div class="tagline">Power on your terms.</div>

      <div class="status" id="status">
        <span class="icon">✉️</span>
        <h2>Confirming your email…</h2>
        <p><span class="spinner"></span></p>
      </div>

      <div class="muted">
        SolGrid — Smart Solar Monitoring &amp; Pay-As-You-Go Energy Platform
      </div>
    </div>
  </div>

<script>
  const API = '/api';

  /* The verification link is the credential itself — never surface the raw
     token back to the page or into any DOM attribute. */
  async function verify() {
    const statusEl = document.getElementById('status');
    const params   = new URLSearchParams(globalThis.location.search);
    const token    = params.get('token');

    if (!token) {
      renderStatus('bad',
        '⚠️',
        'Missing verification link',
        'This link is incomplete — open the full link from your confirmation email.');
      return;
    }

    try {
      const res  = await fetch(`${API}/auth/verify-email?token=${encodeURIComponent(token)}`);
      const data = await res.json().catch(() => ({}));

      if (res.ok && data.success) {
        renderStatus('ok',
          '✅',
          'Email verified',
          'Your address is confirmed and your account is active. You can sign in now.');
        addButton('/login.html', 'Go to Sign In');
      } else if (res.status === 400) {
        renderStatus('bad',
          '⏳',
          'Link expired or already used',
          (data.error || 'This link is invalid or has expired.')
            + ' Go to the sign-in page to request a fresh confirmation link.');
        addButton('/login.html', 'Back to Sign In', true);
      } else {
        renderStatus('bad',
          '⚠️',
          'Something went wrong',
          data.error || 'Could not verify your email right now. Please try again in a few minutes.');
        addButton('/login.html', 'Back to Sign In', true);
      }
    } catch (err) {
      renderStatus('bad',
        '📡',
        'Could not reach the server',
        'Please check your connection and try opening the link again.');
      addButton('/login.html', 'Back to Sign In', true);
    }
  }

  function renderStatus(kind, icon, title, body) {
    const el = document.getElementById('status');
    el.className = `status ${kind}`;
    el.innerHTML = `
      <span class="icon">${icon}</span>
      <h2>${title}</h2>
      <p>${body}</p>`;
  }

  function addButton(href, label, secondary) {
    const el = document.getElementById('status');
    const a  = document.createElement('a');
    a.href        = href;
    a.textContent = label;
    a.className   = `btn ${secondary ? 'secondary' : ''}`;
    el.appendChild(a);
  }

  verify();
</script>
</body>
</html>
