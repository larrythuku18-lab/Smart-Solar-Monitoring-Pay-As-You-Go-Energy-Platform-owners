<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SolGrid — Reset Password</title>
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #060b16; --surface: #0d1520; --card: #111d2e; --border: #1a2840;
      --amber: #f59e0b; --green: #10b981; --red: #ef4444;
      --text: #f1f5f9; --muted: #64748b; --sub: #94a3b8;
    }
    html, body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      color: var(--text);
    }
    body {
      background: linear-gradient(180deg, #060b16 0%, #08101e 100%);
      display: flex; align-items: center; justify-content: center;
      padding: 24px 16px;
    }
    .card {
      width: 100%; max-width: 420px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px; overflow: hidden;
      box-shadow: 0 32px 80px rgba(0,0,0,0.5);
    }
    .card::before {
      content: ''; display: block; height: 3px;
      background: linear-gradient(90deg, var(--amber) 0%, var(--green) 100%);
    }
    .card-body { padding: 36px 32px 28px; }
    .logo { text-align: center; font-size: 26px; font-weight: 800; margin-bottom: 6px;
      background: linear-gradient(135deg, var(--amber) 0%, var(--green) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .subtitle { text-align: center; font-size: 12px; color: var(--muted); margin-bottom: 24px; }
    .form-group { margin-bottom: 16px; }
    .form-label {
      display: block; font-size: 10px; text-transform: uppercase; letter-spacing: .06em;
      font-weight: 600; color: var(--muted); margin-bottom: 7px;
    }
    .form-input {
      width: 100%; padding: 12px 14px;
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      color: var(--text); font-family: inherit; font-size: 14px; outline: none;
      transition: border-color .18s, box-shadow .18s;
    }
    .form-input:focus { border-color: var(--amber); box-shadow: 0 0 0 3px rgba(245,158,11,0.08); }
    .submit-btn {
      width: 100%; padding: 13px; border: none; border-radius: 10px;
      font-family: inherit; font-size: 15px; font-weight: 800; cursor: pointer;
      background: linear-gradient(135deg, #047857, #059669); color: #f0fdf4;
      margin-top: 4px; transition: all .2s;
    }
    .submit-btn:hover:not(:disabled) { transform: translateY(-1px); }
    .submit-btn:disabled { opacity: .55; cursor: not-allowed; }
    .alert {
      padding: 11px 14px; border-radius: 10px; font-size: 12px; line-height: 1.5;
      margin-bottom: 16px; border: 1px solid;
    }
    .alert-error   { background: rgba(239,68,68,0.07);  border-color: rgba(239,68,68,0.25);  color: #fda4af; }
    .alert-success { background: rgba(16,185,129,0.07); border-color: rgba(16,185,129,0.25); color: #a7f3d0; }
    .back-link { text-align: center; font-size: 12px; color: var(--muted); margin-top: 16px; }
    .back-link a { color: var(--green); font-weight: 600; text-decoration: none; }
    .back-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-body">
      <div class="logo">SolGrid</div>
      <div class="subtitle">Choose a new password</div>

      <div id="alert-box" style="display:none"></div>

      <form id="reset-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="password">New Password</label>
          <input id="password" class="form-input" type="password" autocomplete="new-password"
                 placeholder="At least 8 characters" />
        </div>
        <div class="form-group">
          <label class="form-label" for="confirm">Confirm New Password</label>
          <input id="confirm" class="form-input" type="password" autocomplete="new-password"
                 placeholder="Re-enter password" />
        </div>
        <button type="submit" class="submit-btn" id="submit-btn">Set New Password</button>
      </form>

      <div class="back-link"><a href="/login.html">Back to sign in</a></div>
      <div class="back-link" style="margin-top:8px;color:var(--muted)">SolGrid v2.1 · Developed by Larry Thuku</div>
    </div>
  </div>

<script>
  const token = new URLSearchParams(location.search).get('token');

  function showAlert(msg, type) {
    const box = document.getElementById('alert-box');
    box.style.display = 'block';
    box.className = `alert alert-${type}`;
    box.textContent = msg;
  }

  if (!token) {
    showAlert('This reset link is missing its token — open the link from your email again, or request a new one.', 'error');
    document.getElementById('submit-btn').disabled = true;
  }

  document.getElementById('reset-form').addEventListener('submit', async e => {
    e.preventDefault();
    const password = document.getElementById('password').value;
    const confirm  = document.getElementById('confirm').value;

    if (password.length < 8) return showAlert('Password must be at least 8 characters.', 'error');
    if (password !== confirm) return showAlert('Passwords do not match.', 'error');

    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.textContent = 'Saving…';

    try {
      const res  = await fetch('/api/auth/reset-password', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ token, password })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        showAlert(data.error || 'Could not reset password. The link may have expired.', 'error');
        btn.disabled = false;
        btn.textContent = 'Set New Password';
        return;
      }
      showAlert('Password updated. Redirecting to sign in…', 'success');
      setTimeout(() => { location.href = '/login.html'; }, 1200);
    } catch (err) {
      showAlert('Network error. Please check your connection.', 'error');
      btn.disabled = false;
      btn.textContent = 'Set New Password';
    }
  });
</script>
</body>
</html>
