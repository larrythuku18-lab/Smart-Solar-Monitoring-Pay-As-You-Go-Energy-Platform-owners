<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SolGrid — Sign In</title>
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #060b16; --surface: #0d1520; --card: #111d2e; --border: #1a2840;
      --amber: #f59e0b; --green: #10b981; --blue: #3b82f6; --red: #ef4444;
      --purple: #8b5cf6; --text: #f1f5f9; --muted: #64748b; --sub: #94a3b8;
    }

    html, body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      color: var(--text);
    }

    body {
      background:
        radial-gradient(ellipse at 20% 20%, rgba(245,158,11,0.07) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(16,185,129,0.06) 0%, transparent 50%),
        linear-gradient(180deg, #060b16 0%, #08101e 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    /* ── Card ── */
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 32px 80px rgba(0,0,0,0.5);
    }

    /* ── Top accent bar ── */
    .card::before {
      content: '';
      display: block;
      height: 3px;
      background: linear-gradient(90deg, var(--amber) 0%, var(--green) 50%, var(--blue) 100%);
    }

    .card-body { padding: 36px 32px 28px; }

    /* ── Logo ── */
    .logo-wrap { text-align: center; margin-bottom: 28px; }
    .logo {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 32px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--amber) 0%, var(--green) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
    }
    .tagline { font-size: 12px; color: var(--muted); margin-top: 6px; letter-spacing: .02em; }

    /* ── Role toggle ── */
    .role-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 24px;
      gap: 4px;
    }
    .role-btn {
      padding: 10px 8px;
      border-radius: 9px;
      border: none;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all .2s;
      color: var(--muted);
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .role-btn.active-admin {
      background: linear-gradient(135deg, rgba(139,92,246,0.18), rgba(99,102,241,0.12));
      color: #c4b5fd;
      border: 1px solid rgba(139,92,246,0.3);
      box-shadow: 0 2px 12px rgba(139,92,246,0.15);
    }
    .role-btn.active-engineer {
      background: linear-gradient(135deg, rgba(20,184,166,0.18), rgba(14,165,233,0.12));
      color: #5eead4;
      border: 1px solid rgba(20,184,166,0.3);
      box-shadow: 0 2px 12px rgba(20,184,166,0.15);
    }
    .role-btn:not(.active-admin):not(.active-engineer):hover { color: var(--sub); background: rgba(255,255,255,.04); }

    /* ── Role description pill ── */
    .role-desc {
      font-size: 11px;
      padding: 8px 14px;
      border-radius: 8px;
      margin-bottom: 20px;
      line-height: 1.5;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .role-desc.admin-desc    { background: rgba(139,92,246,0.07); color: #ddd6fe; border: 1px solid rgba(139,92,246,0.2); }
    .role-desc.engineer-desc { background: rgba(20,184,166,0.07);  color: #99f6e4; border: 1px solid rgba(20,184,166,0.2); }

    /* ── Form ── */
    .form-group { margin-bottom: 16px; }
    .form-label {
      display: block;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .06em;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 7px;
    }
    .form-input {
      width: 100%;
      padding: 12px 14px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 14px;
      outline: none;
      transition: border-color .18s, box-shadow .18s, background .18s;
    }
    .form-input:focus {
      border-color: var(--amber);
      box-shadow: 0 0 0 3px rgba(245,158,11,0.08);
      background: rgba(245,158,11,0.02);
    }
    .form-input::placeholder { color: var(--muted); }

    /* ── Submit ── */
    .submit-btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: all .2s;
      margin-top: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      letter-spacing: .01em;
    }
    .submit-btn.admin-btn {
      background: linear-gradient(135deg, #7c3aed, #6366f1);
      color: #fff;
      box-shadow: 0 4px 20px rgba(124,58,237,0.3);
    }
    .submit-btn.admin-btn:hover:not(:disabled) { box-shadow: 0 6px 28px rgba(124,58,237,0.45); transform: translateY(-1px); }
    .submit-btn.engineer-btn {
      background: linear-gradient(135deg, #0d9488, #0891b2);
      color: #f0fdfa;
      box-shadow: 0 4px 20px rgba(20,184,166,0.3);
    }
    .submit-btn.engineer-btn:hover:not(:disabled) { box-shadow: 0 6px 28px rgba(20,184,166,0.45); transform: translateY(-1px); }
    .submit-btn:active:not(:disabled) { transform: translateY(0); }
    .submit-btn:disabled { opacity: .55; cursor: not-allowed; transform: none !important; }

    /* ── Spinner ── */
    .spinner {
      width: 15px; height: 15px;
      border: 2px solid rgba(255,255,255,0.25);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .75s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Alert ── */
    .alert {
      padding: 11px 14px;
      border-radius: 10px;
      font-size: 12px;
      line-height: 1.5;
      margin-bottom: 16px;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      border: 1px solid;
    }
    .alert-error   { background: rgba(239,68,68,0.07);   border-color: rgba(239,68,68,0.25);   color: #fda4af; }
    .alert-success { background: rgba(16,185,129,0.07);  border-color: rgba(16,185,129,0.25);  color: #a7f3d0; }
    .alert-info    { background: rgba(59,130,246,0.07);  border-color: rgba(59,130,246,0.25);  color: #bfdbfe; }
    .verify-resend {
      display: block;
      margin-top: 8px;
      background: transparent;
      border: 1px solid currentColor;
      color: inherit;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity .2s;
    }
    .verify-resend:hover { opacity: .8; }
    .verify-resend:disabled { opacity: .5; cursor: default; }

    /* ── Demo credentials ── */
    .demo-box {
      margin-top: 20px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .demo-head {
      padding: 9px 14px;
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: .08em;
      font-weight: 700;
      color: var(--muted);
      background: rgba(255,255,255,.02);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .demo-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 14px;
      border-bottom: 1px solid rgba(255,255,255,.04);
      font-size: 11px;
      gap: 12px;
    }
    .demo-row:last-child { border-bottom: none; }
    .demo-row.clickable { cursor: pointer; transition: background .15s; }
    .demo-row.clickable:hover { background: rgba(255,255,255,.04); }
    .demo-row.clickable:active { background: rgba(255,255,255,.07); }
    .demo-key { color: var(--muted); white-space: nowrap; }
    .demo-val {
      font-family: monospace;
      font-size: 11px;
      font-weight: 600;
      text-align: right;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .demo-val.amber { color: var(--amber); }
    .demo-val.green { color: var(--green); }
    .demo-val.blue  { color: #93c5fd; }
    .demo-val.teal  { color: var(--teal); }
    .demo-section-label {
      padding: 6px 14px 3px;
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: var(--muted);
      opacity: .7;
    }
    .demo-note {
      padding: 8px 14px;
      font-size: 10px;
      color: var(--muted);
      border-top: 1px solid var(--border);
      background: rgba(255,255,255,.01);
    }

    /* ── Password visibility toggle ── */
    .pw-wrap { position: relative; }
    .pw-wrap .form-input { padding-right: 42px; }
    .pw-toggle {
      position: absolute;
      right: 13px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      padding: 2px;
      color: var(--muted);
      display: flex;
      align-items: center;
      transition: color .15s;
    }
    .pw-toggle:hover { color: var(--sub); }
    .pw-toggle svg { width: 17px; height: 17px; }

    /* ── Auth mode toggle (login / sign up) ── */
    .auth-toggle {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      margin-top: 14px;
    }
    .auth-toggle a {
      color: var(--green);
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }
    .auth-toggle a:hover { text-decoration: underline; }

    /* ── Divider ── */
    .divider {
      display: flex; align-items: center; gap: 10px;
      margin: 20px 0 4px;
      font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }

    /* ── Footer ── */
    .card-footer {
      text-align: center;
      padding: 14px 32px 20px;
      font-size: 11px;
      color: var(--muted);
      border-top: 1px solid var(--border);
    }

    @media (max-width: 440px) {
      .card-body { padding: 28px 20px 20px; }
      .card-footer { padding: 12px 20px 18px; }
      .logo { font-size: 26px; }
      /* Three tabs + long labels get tight on small phones — let them wrap. */
      .role-btn { font-size: 12px; padding: 9px 4px; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-body">

      <!-- Logo -->
      <div class="logo-wrap">
        <div class="logo">SolGrid</div>
        <div class="tagline">Power on your terms.</div>
      </div>

      <!-- Alert -->
      <div id="alert-box" style="display:none"></div>

      <!-- Role toggle -->
      <div class="role-toggle">
        <button class="role-btn active-admin" id="btn-admin">Admin / Operator</button>
        <button class="role-btn" id="btn-engineer">Engineer</button>
      </div>

      <!-- Role description -->
      <div id="role-desc" class="role-desc admin-desc">
        <span id="role-desc-text">Full system access — dashboards, analytics, transaction management, and AI insights.</span>
      </div>

      <!-- Form -->
      <form id="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" id="id-label" for="identifier">Email Address</label>
          <input id="identifier" class="form-input" type="text" autocomplete="username"
                 placeholder="admin@solarpayg.com" required />
        </div>
        <div class="form-group">
          <label class="form-label" id="pw-label" for="password">Password</label>
          <div class="pw-wrap">
            <input id="password" class="form-input" type="password" autocomplete="current-password"
                   placeholder="Enter password" required />
            <button type="button" class="pw-toggle" data-target="password" aria-label="Show password">
              <svg id="eye-password" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <button type="submit" class="submit-btn admin-btn" id="submit-btn">
          <span id="btn-text">Sign in as Admin</span>
        </button>
      </form>

      <!-- Reused for the forgot-password "back to sign in" link -->
      <div id="auth-toggle" class="auth-toggle" style="display:none">
        <span id="auth-toggle-text">Remembered it?</span> <a id="auth-toggle-link">Back to sign in</a>
      </div>

      <!-- Forgot password (email+password accounts, any role) -->
      <div id="forgot-toggle" class="auth-toggle">
        <a id="forgot-link">Forgot password?</a>
      </div>

      <!-- Demo credentials -->
      <div class="divider" id="demo-divider">Demo credentials</div>
      <div class="demo-box" id="demo-box">
        <!-- populated by JS -->
      </div>

    </div><!-- /card-body -->

    <div class="card-footer">
      All data is simulated · SolGrid v2.1 · Nairobi, Kenya<br>
      Developed by Larry Thuku
    </div>
  </div>

<script>
  const API = '/api';
  let activeRole = 'admin';
  let authMode   = 'login'; // 'login' | 'forgot'

  /* ── Demo credential sets ── */
  const CREDS = {
    admin: [
      { key: 'Email',    val: 'admin@solarpayg.com', cls: 'amber' },
      { key: 'Password', val: 'Admin@12345',          cls: 'amber' }
    ],
    engineer: [
      { key: 'Email',    val: 'engineer@solarpayg.com', cls: 'teal' },
      { key: 'Password', val: 'Engineer@12345',          cls: 'teal' }
    ]
  };

  /* ── Fill demo box ── */
  function renderDemoBox(role) {
    const head = `<div class="demo-head">Test Credentials <span style="color:var(--amber)">· click row to fill</span></div>`;
    const note = `<div class="demo-note">Demo only — not for production use</div>`;

    let rows = '';
    if (role === 'admin') {
      rows = `
        <div class="demo-row clickable" data-fill="admin" title="Click to fill">
          <span class="demo-key">Email</span>
          <span class="demo-val amber">${CREDS.admin[0].val}</span>
        </div>
        <div class="demo-row clickable" data-fill="admin" title="Click to fill">
          <span class="demo-key">Password</span>
          <span class="demo-val amber">${CREDS.admin[1].val}</span>
        </div>`;
    } else {
      rows = `
        <div class="demo-row clickable" data-fill="engineer" title="Click to fill">
          <span class="demo-key">Email</span>
          <span class="demo-val teal">${CREDS.engineer[0].val}</span>
        </div>
        <div class="demo-row clickable" data-fill="engineer" title="Click to fill">
          <span class="demo-key">Password</span>
          <span class="demo-val teal">${CREDS.engineer[1].val}</span>
        </div>`;
    }

    document.getElementById('demo-box').innerHTML = head + rows + note;
  }

  /* ── Fill form with demo creds ── */
  function fillCreds(set) {
    const id  = document.getElementById('identifier');
    const pw  = document.getElementById('password');
    /* '(set by operator)' is a display hint, not a password — leave the
       field alone so the user types the real one. */
    const fillPw = v => { if (!v.startsWith('(')) pw.value = v; };
    if (set === 'admin') {
      id.value = CREDS.admin[0].val;
      fillPw(CREDS.admin[1].val); // NOSONAR
    } else if (set === 'engineer') {
      id.value = CREDS.engineer[0].val;
      fillPw(CREDS.engineer[1].val); // NOSONAR
    }
  }

  /* ── Switch role ── */
  function setRole(role) {
    activeRole = role;

    const btnAdmin    = document.getElementById('btn-admin');
    const desc        = document.getElementById('role-desc');
    const descTxt     = document.getElementById('role-desc-text');
    const idLabel     = document.getElementById('id-label');
    const idInput     = document.getElementById('identifier');
    const pwLabel     = document.getElementById('pw-label');
    const submitBtn   = document.getElementById('submit-btn');
    const btnText     = document.getElementById('btn-text');

    const btnEngineer = document.getElementById('btn-engineer');

    if (role === 'admin') {
      btnAdmin.className    = 'role-btn active-admin';
      btnEngineer.className = 'role-btn';
      desc.className        = 'role-desc admin-desc';
      descTxt.textContent   = 'Full system access — live monitoring, appliance insights, and AI analytics.';
      idLabel.textContent   = 'Email Address';
      idInput.placeholder   = 'admin@solarpayg.com';
      pwLabel.textContent   = 'Password';
      submitBtn.className   = 'submit-btn admin-btn';
      btnText.textContent   = 'Sign in as Admin';
    } else {
      btnAdmin.className    = 'role-btn';
      btnEngineer.className = 'role-btn active-engineer';
      desc.className        = 'role-desc engineer-desc';
      descTxt.textContent   = 'Field diagnostics — fleet connectivity, panel health, and firmware/OTA status (read-only).';
      idLabel.textContent   = 'Email Address';
      idInput.placeholder   = 'engineer@solarpayg.com';
      pwLabel.textContent   = 'Password';
      submitBtn.className   = 'submit-btn engineer-btn';
      btnText.textContent   = 'Sign in as Engineer';
    }
    document.getElementById('auth-toggle').style.display = 'none';

    document.getElementById('identifier').value = '';
    document.getElementById('password').value   = '';
    setAuthMode('login');
    clearAlert();
    renderDemoBox(role);
  }

  /* ── Default submit-button label for the current role/mode ── */
  function defaultBtnText() {
    if (authMode === 'forgot') return 'Send Reset Link';
    return activeRole === 'admin' ? 'Sign in as Admin' : 'Sign in as Engineer';
  }

  /* ── Switch between normal sign-in and the forgot-password form ── */
  function setAuthMode(mode) {
    authMode = mode;

    const idLabel      = document.getElementById('id-label');
    const idInput      = document.getElementById('identifier');
    const pwLabel      = document.getElementById('pw-label');
    const passwordEl   = document.getElementById('password');
    const demoDivider  = document.getElementById('demo-divider');
    const demoBox      = document.getElementById('demo-box');

    const isForgot = mode === 'forgot';
    const pwGroup  = passwordEl.closest('.form-group');

    pwGroup.style.display     = isForgot ? 'none'  : 'block';
    demoDivider.style.display = isForgot ? 'none' : 'block';
    demoBox.style.display     = isForgot ? 'none' : 'block';
    document.getElementById('forgot-toggle').style.display = isForgot ? 'none' : 'block';
    document.getElementById('auth-toggle').style.display   = isForgot ? 'block' : 'none';

    if (isForgot) {
      idLabel.textContent = 'Email Address';
      idInput.placeholder = 'you@example.com';
    } else if (activeRole === 'admin') {
      idLabel.textContent = 'Email Address';
      idInput.placeholder = 'admin@solarpayg.com';
      pwLabel.textContent = 'Password';
      passwordEl.placeholder = 'Enter password';
    } else {
      idLabel.textContent = 'Email Address';
      idInput.placeholder = 'engineer@solarpayg.com';
      pwLabel.textContent = 'Password';
      passwordEl.placeholder = 'Enter password';
    }

    document.getElementById('btn-text').textContent = defaultBtnText();
    clearAlert();
  }

  /* ── Alert helpers ── */
  function showAlert(msg, type) {
    const box = document.getElementById('alert-box');
    box.style.display = 'flex';
    box.className      = `alert alert-${type}`;
    box.innerHTML      = `<span>${msg}</span>`;
    if (type === 'error') setTimeout(clearAlert, 5000);
  }
  function clearAlert() {
    const box = document.getElementById('alert-box');
    box.style.display = 'none';
    box.innerHTML      = '';
  }

  /* ── Email-verification prompt ── */
  let pendingVerifyEmail = null;

  /* Escape user-controlled text (an email address) before it lands in
     innerHTML — showAlert interpolates raw HTML. */
  function esc(value) {
    return String(value).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  /* A block-level notice rendered into #alert-box when an account needs its
     email confirmed — shown both when a signup created an unverified account
     (kind 'info') and when a login attempt was blocked (kind 'error'). The
     resend button lets the user request a fresh link without leaving the
     page. */
  function showVerifyCard(kind, html, email) {
    pendingVerifyEmail = email;
    const box = document.getElementById('alert-box');
    box.style.display = 'block';
    box.className = `alert alert-${kind === 'error' ? 'error' : 'info'}`;
    box.innerHTML = `<span style="flex:1">${html}
        <button type="button" class="verify-resend" id="resend-btn">Resend verification link</button>
      </span>`;
    document.getElementById('resend-btn').addEventListener('click', resendVerification);
  }

  /* POST /api/auth/resend-verification — the server answers identically for
     known and unknown addresses, so a success here only means "if that
     account is unverified, mail went out". */
  async function resendVerification() {
    if (!pendingVerifyEmail) return;
    const btn = document.getElementById('resend-btn');
    if (btn) { btn.disabled = true; btn.textContent = 'Sending…'; }
    try {
      const res  = await fetch(`${API}/auth/resend-verification`, {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ email: pendingVerifyEmail })
      });
      const data = await res.json().catch(() => ({}));
      if (res.ok) {
        clearAlert();
        showAlert(data.message || 'If that account is unverified, a new confirmation link has been sent.', 'success');
      } else {
        showAlert(data.error || 'Could not resend the link — please try again in a few minutes.', 'error');
      }
    } catch (err) {
      console.error('Resend verification error:', err);
      showAlert('Network error. Please check your connection.', 'error');
    }
  }

  /* ── Login ── */
  async function handleLogin(e) {
    e.preventDefault();
    clearAlert();

    if (authMode === 'forgot') return handleForgot();

    const identifier = document.getElementById('identifier').value.trim();
    const password   = document.getElementById('password').value;

    if (!identifier || !password) {
      showAlert('Please enter both identifier and password / PIN.', 'error');
      return;
    }

    const btn     = document.getElementById('submit-btn');
    const btnText = document.getElementById('btn-text');
    btn.disabled  = true;
    btnText.innerHTML = '<span class="spinner"></span> Signing in…';

    /* Our free-tier host spins the backend down after inactivity — the first
       request after a while can take 30-60s to wake it. Most logins resolve
       in well under that, so only show this once the wait is unusual. */
    const wakeTimer = setTimeout(() => {
      btnText.innerHTML = '<span class="spinner"></span> Waking up server… this can take up to a minute';
    }, 4000);

    try {
      /* Build payload: device ID + numeric PIN  vs  email + password */
      const isDeviceId = /^[A-Z0-9-]{3,20}$/i.test(identifier) && /^\d{3,6}$/.test(password);
      const payload    = isDeviceId
        ? { deviceId: identifier.toUpperCase(), pin: password }
        : { email: identifier, password };

      const res  = await fetch(`${API}/auth/login`, {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify(payload)
      });
      clearTimeout(wakeTimer);
      const data = await res.json().catch(() => ({}));
      const tok  = data.token || data.accessToken;

      if (!res.ok || !tok) {
        /* Unverified self-signup account — the password is right but the
           email confirmation link hasn't been clicked yet. Offer a resend
           instead of a misleading generic "invalid credentials" error. */
        if (res.status === 403 && data.error === 'EMAIL_NOT_VERIFIED') {
          const addr = String(data.email || identifier);
          showVerifyCard('error',
            `Please verify <b>${esc(addr)}</b> before signing in — check your inbox for the confirmation link we sent when you created the account.`,
            addr);
          btn.disabled  = false;
          btnText.textContent = defaultBtnText();
          return;
        }
        showAlert(data.error || data.message || 'Invalid credentials. Please try again.', 'error');
        btn.disabled  = false;
        btnText.textContent = defaultBtnText();
        return;
      }

      /* Persist token and role */
      const role = data.user?.role || 'customer';
      localStorage.setItem('authToken', tok);
      localStorage.setItem('userRole',  role);
      if (data.user?.deviceId) localStorage.setItem('deviceId', data.user.deviceId);

      showAlert('Login successful! Redirecting…', 'success');

      /* Role-based redirect — show intro on fresh login */
      setTimeout(() => {
        globalThis.location.href = '/intro.html';
      }, 700);

    } catch (err) {
      clearTimeout(wakeTimer);
      console.error('Login error:', err);
      showAlert('Network error. Please check your connection.', 'error');
      btn.disabled  = false;
      btnText.textContent = defaultBtnText();
    }
  }

  /* ── Forgot password: request a reset link by email ── */
  async function handleForgot() {
    const email = document.getElementById('identifier').value.trim();
    if (!email || !email.includes('@')) {
      showAlert('Please enter the email address on your account.', 'error');
      return;
    }

    const btn     = document.getElementById('submit-btn');
    const btnText = document.getElementById('btn-text');
    btn.disabled  = true;
    btnText.innerHTML = '<span class="spinner"></span> Sending…';

    try {
      const res  = await fetch(`${API}/auth/forgot-password`, {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ email })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        showAlert(data.error || 'Could not send reset link. Please try again.', 'error');
      } else {
        showAlert(data.message || 'If that email has an account, a reset link has been sent.', 'success');
      }
    } catch (err) {
      console.error('Forgot password error:', err);
      showAlert('Network error. Please check your connection.', 'error');
    } finally {
      btn.disabled = false;
      btnText.textContent = defaultBtnText();
    }
  }

  /* ── Auto-redirect if already logged in ── */
  (async () => {
    const tok = localStorage.getItem('authToken');
    if (!tok) return;
    try {
      const res  = await fetch(`${API}/auth/me`, { headers: { Authorization: `Bearer ${tok}` } });
      if (!res.ok) { localStorage.removeItem('authToken'); return; }
      const user = await res.json();
      /* super-admins AND org admins land on the admin dashboard — org admins
         see only their own tenant's data (backend-enforced). Engineers land
         on the Engineer panel. There is no customer panel anymore, so a
         logged-in customer token just falls through to the login form
         below instead of redirecting anywhere (redirecting to this same
         page would loop). */
      if (user.role === 'admin' || user.role === 'org_admin') {
        globalThis.location.href = '/index.html';
      } else if (user.role === 'engineer') {
        globalThis.location.href = '/engineer.html';
      }
    } catch (e) {
      console.warn('Auto-redirect check failed — showing login form.', e);
    }
  })();

  /* ── Init ── */
  document.getElementById('btn-admin').addEventListener('click', () => setRole('admin'));
  document.getElementById('btn-engineer').addEventListener('click', () => setRole('engineer'));
  document.getElementById('login-form').addEventListener('submit', handleLogin);
  document.getElementById('demo-box').addEventListener('click', e => {
    const row = e.target.closest('[data-fill]');
    if (row) fillCreds(row.dataset.fill);
  });
  document.getElementById('auth-toggle-link').addEventListener('click', e => {
    e.preventDefault();
    setAuthMode('login');
  });
  document.getElementById('forgot-link').addEventListener('click', e => {
    e.preventDefault();
    setAuthMode('forgot');
  });

  /* ── Password visibility toggles ── */
  const EYE_OPEN  = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
  const EYE_SHUT  = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>`;
  document.querySelectorAll('.pw-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const input = document.getElementById(btn.dataset.target);
      const eye   = btn.querySelector('svg');
      if (input.type === 'password') {
        input.type  = 'text';
        eye.innerHTML = EYE_SHUT;
        btn.setAttribute('aria-label', 'Hide password');
      } else {
        input.type  = 'password';
        eye.innerHTML = EYE_OPEN;
        btn.setAttribute('aria-label', 'Show password');
      }
    });
  });
  /* ADMIN_EMAIL/CUSTOMER_EMAIL can be overridden per environment (local vs
     production) — fetch the actual configured values so the displayed demo
     credentials never go stale/wrong, instead of hardcoding the defaults. */
  async function loadDemoCredentials() {
    try {
      const res  = await fetch(`${API}/demo-credentials`);
      const data = await res.json();
      if (data.adminEmail)    CREDS.admin[0].val    = data.adminEmail;
      if (data.engineerEmail) CREDS.engineer[0].val = data.engineerEmail;
      /* If the operator overrode a demo password via env, the hardcoded
         default shown here would be wrong — display a hint instead. The
         real value is never exposed. */
      if (data.adminPasswordIsDefault === false)    CREDS.admin[1].val    = '(set by operator)';
      if (data.engineerPasswordIsDefault === false) CREDS.engineer[1].val = '(set by operator)';
    } catch (e) { /* keep hardcoded defaults if this fails */ }
    renderDemoBox(activeRole);
  }
  loadDemoCredentials();
</script>
</body>
</html>
