# Nightly PostgreSQL backup of the production database (Neon, since 2026-07-06).
#
# Neon's free plan only keeps a short point-in-time restore window, and a
# manual incident this project already had (a temporarily broken
# DATABASE_URL) is exactly the kind of thing that could just as easily
# have been "the database is gone" instead of "the connection string is
# wrong" — there'd be no way back without an offsite dump like this.
#
# Setup — and REQUIRED again whenever the database moves providers:
#   1. Copy the production database connection string.
#      For Neon: console -> project -> Connect -> use the DIRECT connection
#      string, not the pooled one. Pooled endpoints (hostname contains
#      "-pooler") sit behind PgBouncer in transaction mode, which pg_dump
#      can't use. The job strips "-pooler" from neon.tech hosts as a safety
#      net, but store the direct one anyway.
#   2. GitHub repo -> Settings -> Secrets and variables -> Actions ->
#      set/update the BACKUP_DATABASE_URL secret.
#   3. Actions tab -> Database Backup -> Run workflow, to confirm it passes.
#
# To restore a backup:
#   Download the artifact from a workflow run, then:
#   pg_restore --clean --no-owner -d "<DATABASE_URL>" backup-YYYY-MM-DD.dump
#
# Until the secret is set, this job logs a clear skip message and exits
# successfully — safe to merge without it actually doing anything yet.
name: Database Backup

on:
  schedule:
    - cron: '0 3 * * *'  # 03:00 UTC daily
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Dump database
        id: dump
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::BACKUP_DATABASE_URL secret not set — skipping. See .github/workflows/db-backup.yml for setup steps."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

          # Neon's pooled endpoints (PgBouncer in transaction mode) can't run
          # pg_dump; the direct endpoint is the same host without "-pooler".
          case "$DATABASE_URL" in
            *-pooler.*neon.tech*)
              echo "::warning::BACKUP_DATABASE_URL is Neon's pooled endpoint — using the direct endpoint for pg_dump. Update the secret to the direct connection string to silence this."
              DATABASE_URL="${DATABASE_URL/-pooler./.}"
              ;;
          esac

          # Probe with the runner's preinstalled psql before dumping: it
          # separates "can't reach the database / stale secret" from a
          # pg_dump problem in the logs, and reports the server's major
          # version so we can install the matching client below. A
          # short-lived CI runner making a brand-new connection to a
          # free-tier Postgres can hit transient hiccups, so retry.
          command -v psql >/dev/null || sudo apt-get install -y -qq postgresql-client
          server_num=""
          for attempt in 1 2 3 4 5; do
            if server_num=$(psql "$DATABASE_URL" -tAc 'show server_version_num') && [ -n "$server_num" ]; then
              break
            fi
            server_num=""
            echo "::warning::connection attempt $attempt failed, retrying in 15s…"
            sleep 15
          done
          if [ -z "$server_num" ]; then
            echo "::error::Cannot connect to the database after 5 attempts. Check the BACKUP_DATABASE_URL secret — the production database moved to Neon on 2026-07-06, so if this secret still holds the old Render URL it must be updated (repo Settings -> Secrets and variables -> Actions, then re-run this workflow)."
            exit 1
          fi
          server_major=$((server_num / 10000))
          echo "Server is PostgreSQL $server_major (server_version_num=$server_num)"

          # pg_dump refuses to dump a server newer than itself ("aborting
          # because of server version mismatch"), and Ubuntu's packaged
          # client lags behind managed providers — so instead of pinning a
          # version here (which broke once already), install the exact
          # matching major from PGDG whenever the preinstalled one differs.
          if ! pg_dump --version 2>/dev/null | grep -q " $server_major\."; then
            sudo install -d /usr/share/postgresql-common/pgdg
            sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
            echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo "$VERSION_CODENAME")-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
            sudo apt-get update -qq
            sudo apt-get install -y -qq "postgresql-client-$server_major"
          fi

          for attempt in 1 2 3 4 5; do
            if pg_dump "$DATABASE_URL" -F c -f "backup-$(date +%Y-%m-%d).dump"; then
              exit 0
            fi
            echo "::warning::pg_dump attempt $attempt failed, retrying in 15s…"
            sleep 15
          done
          echo "::error::pg_dump failed after 5 attempts"
          exit 1

      - name: Upload backup artifact
        # The secrets context isn't available in step `if:` conditions
        # (GitHub rejects the whole workflow file with "Unrecognized
        # named-value: 'secrets'" if you try) — read whether it was
        # configured from the previous step's output instead.
        if: steps.dump.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: backup-*.dump
          retention-days: 30
