name: CI/CD Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: solarpayg_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run linting
      run: npm run lint 2>/dev/null || echo "No lint script defined"

    - name: Run tests
      run: npm test
      env:
        NODE_ENV: test
        # db.js reads a single DATABASE_URL connection string, not separate
        # DB_HOST/DB_PORT/etc — those were silently ignored before.
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/solarpayg_test
        JWT_SECRET: test-jwt-secret-key-for-ci-only

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage/lcov.info

  # Render is connected directly to this repo's GitHub integration and
  # auto-deploys on every push to master — there is no separate deploy step to
  # run from here. This job instead smoke-tests the self-hosted Docker Compose
  # path (README "Option B"): does the image build, and does a container
  # booted against a real Postgres actually come up and answer /health.
  docker-build-smoke-test:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: solarpayg_docker_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Build Docker image
      run: |
        docker build -t solarpayg-platform:${{ github.sha }} .
        docker tag solarpayg-platform:${{ github.sha }} solarpayg-platform:latest

    - name: Run container against real Postgres and check /health
      run: |
        docker run --rm -d --name test-container \
          --network host \
          -e NODE_ENV=test \
          -e DATABASE_URL=postgresql://postgres:postgres@localhost:5432/solarpayg_docker_test \
          -e JWT_SECRET=test-jwt-secret-key-for-ci-only \
          -e PORT=3000 \
          solarpayg-platform:latest
        sleep 10
        curl -f http://localhost:3000/health || { docker logs test-container; exit 1; }
        docker stop test-container

  security-scan:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Run security scan
      uses: github/super-linter/slim@v5
      env:
        DEFAULT_BRANCH: master
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VALIDATE_ALL_CODEBASE: false
        VALIDATE_JAVASCRIPT_ES: true
        VALIDATE_JSON: true
        VALIDATE_YAML: true

    - name: Dependency vulnerability scan
      run: |
        npm audit --audit-level moderate
      continue-on-error: true

  performance-test:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: solarpayg_perf_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run performance tests
      env:
        NODE_ENV: test
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/solarpayg_perf_test
        JWT_SECRET: test-jwt-secret-key-for-ci-only
      run: |
        # Simple performance test - measure startup time
        START_TIME=$(date +%s%N)
        timeout 30s npm start &
        SERVER_PID=$!
        sleep 5

        # Test basic endpoint — /api/auth/status doesn't exist on this API,
        # so just check the health endpoint server.js actually exposes.
        curl -f http://localhost:3000/health

        END_TIME=$(date +%s%N)
        STARTUP_TIME=$(( (END_TIME - START_TIME) / 1000000 )) # Convert to milliseconds

        echo "Server startup time: ${STARTUP_TIME}ms"
        kill $SERVER_PID 2>/dev/null || true

        # Fail if startup takes more than 10 seconds
        if [ "$STARTUP_TIME" -gt 10000 ]; then
          echo "Performance test failed: Startup too slow"
          exit 1
        fi